# Configuration file

features {
    # Enable wildcard expansion and controls for AE2 Interfaces, including AE2FC dual interfaces. [default: true]
    B:ae2InterfaceWildcard=true

    # Prevent an extra Better Loading Screen resource refresh on its rendering thread. [default: true]
    B:betterLoadingScreenCompat=true

    # Enable non-consumable processing patterns, CRIB reservations and NEI recipe transfer integration. [default: true]
    B:cribNonConsumable=true

    # Enable CRIB wildcard expansion, button and Soft Mallet toggle. [default: true]
    B:cribWildcard=true

    # Register the Linked Input Hatch and its recipe. Leave enabled when the world contains linked hatches. [default: true]
    B:linkedInputHatch=true

    # Enable one configurable virtual ore source per chunk in PersonalSpace dimensions. Block registration is permanent for save compatibility. [default: true]
    B:oreSourceBlock=true

    # GT single-block and multiblock ore miners draw non-depleting ores from the current dimension's void-miner pool. [default: false]
    B:voidMiners=false

    # GT fluid pumps preserve world fluid source blocks and underground oil drills never deplete their deposits. [default: false]
    B:voidPumps=false

    # Enable XTProfile timing/route tracking and the AE2 Crafting CPU side panel. [default: true]
    B:xtProfile=true
}


