# Configuration file

diagnostics {
    # Show client frametime and heap estimates on the F3 debug overlay.
    B:showF3Statistics=false
}


display {
    # Approximate FPS cap when the game is unfocused or hidden; 0 disables it. [range: 0 ~ 120, default: 20]
    I:backgroundFps=20
}


particles {
    # Reduce the particle cap during sustained slow rendering. May cause more particles to disappear.
    B:adaptiveBudget=false

    # Apply an upper bound to particle lists to reduce CPU work and heap use under load.
    B:enabled=true

    # Reject particles farther from the player than this distance; 0 disables distance culling. [range: 0 ~ 512, default: 0]
    I:maxDistanceBlocks=0

    # Maximum number of particles in each vanilla effect layer (vanilla: 4000). [range: 128 ~ 4000, default: 3072]
    I:maxPerLayer=3072
}


textures {
    # Call the animated texture atlas update once per N ticks. Values above 1 slow texture animations. [range: 1 ~ 8, default: 1]
    I:animationTickInterval=1
}


